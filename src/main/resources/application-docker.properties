spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:qoldan_qolga}
spring.datasource.username=${DB_USER:qoldan}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.devtools.restart.enabled=false
server.forward-headers-strategy=framework
app.jwt.secret=${JWT_SECRET}
app.myid.redirect-uri=${MYID_REDIRECT_URI:http://qoldan-qolga.uz/dashboard/verification/callback}
app.upload.dir=${UPLOAD_DIR:/app/uploads}
app.docs.dir=${DOCS_DIR:/app/uploads/docs}
