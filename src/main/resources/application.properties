spring.application.name=qoldan-qolga

server.port=8080
server.forward-headers-strategy=none

spring.mvc.static-path-pattern=/content/**
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/qoldan-qolga
spring.datasource.username=postgres
spring.datasource.password=1
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=HikariPool
spring.lifecycle.timeout-per-shutdown-phase=30s

spring.devtools.restart.enabled=false

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Optional: log SQL parameters (dev only)
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

app.jwt.secret=${JWT_SECRET:default-secret-change-in-production-min-256-bits-for-hmac}
app.jwt.expiration-ms=86400000

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# WebSocket
websocket.topic.chat.prefix=/topic/chat/

app.myid.base-url=${MYID_BASE_URL:https://api.myid.uz}
app.myid.path.access-token=${MYID_PATH_ACCESS_TOKEN:/api/v1/oauth2/access-token}
app.myid.path.create-task=${MYID_PATH_CREATE_TASK:/api/v1/authentication/simple-inplace-authentication-request-task}
app.myid.path.status-by-external=${MYID_PATH_STATUS_BY_EXTERNAL:/api/v1/authentication/authentication-request-status-by-external}
app.myid.client-id=${MYID_CLIENT_ID:}
app.myid.username=${MYID_USERNAME:}
app.myid.password=${MYID_PASSWORD:}

app.myid.redirect-url=${MYID_REDIRECT_URL:}
app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.url-prefix=/uploads/
app.upload.max-file-size=5242880
app.upload.default-extension=.jpg
# Документы для заявок «для бизнеса» (сканы, PDF) — отдельная папка
app.docs.dir=${DOCS_DIR:uploads/docs}
app.docs.url-prefix=/docs/
app.docs.max-file-size=20971520
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB
