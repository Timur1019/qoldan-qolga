spring.application.name=qoldan-qolga

# Опционально: локальные секреты из корня проекта (не в jar)
spring.config.import=optional:file:./application-local.properties

server.port=8080
server.forward-headers-strategy=none

spring.mvc.static-path-pattern=/content/**
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/qoldan-qolga
spring.datasource.username=postgres
spring.datasource.password=1
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP) — enough for Tomcat + async view/image workers
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=HikariPool

server.tomcat.threads.min-spare=10
server.tomcat.threads.max=80

spring.task.scheduling.pool.size=2
spring.lifecycle.timeout-per-shutdown-phase=30s

spring.devtools.restart.enabled=false

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Optional: log SQL parameters (dev only)
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

app.jwt.secret=${JWT_SECRET:default-secret-change-in-production-min-256-bits-for-hmac}
app.jwt.expiration-ms=86400000

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# WebSocket
websocket.topic.chat.prefix=/topic/chat/

app.myid.base-url=${MYID_BASE_URL:https://api.myid.uz}
app.myid.web-sdk-url=${MYID_WEB_SDK_URL:https://web.myid.uz}
app.myid.access-token-path=${MYID_PATH_ACCESS_TOKEN:/api/v1/oauth2/access-token}
app.myid.web-sessions-path=${MYID_PATH_WEB_SESSIONS:/api/v1/web/sessions}
app.myid.users-me-path=${MYID_PATH_USERS_ME:/api/v1/users/me}
app.myid.client-id=${MYID_CLIENT_ID:}
app.myid.client-secret=${MYID_CLIENT_SECRET:}
app.myid.username=${MYID_USERNAME:}
app.myid.password=${MYID_PASSWORD:}
app.myid.redirect-uri=${MYID_REDIRECT_URI:http://127.0.0.1:5173/dashboard/verification/callback}
app.myid.max-retries=${MYID_MAX_RETRIES:3}
app.myid.default-lang=${MYID_LANG:ru}
app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.url-prefix=/uploads/
app.upload.max-file-size=5242880
app.upload.default-extension=.jpg
# Документы для заявок «для бизнеса» (сканы, PDF) — отдельная папка
app.docs.dir=${DOCS_DIR:uploads/docs}
app.docs.url-prefix=/docs/
app.docs.max-file-size=20971520

# DevSMS (OTP). Токен в .env (DEVSMS_TOKEN) — файл .env в gitignore.
app.devsms.base-url=${DEVSMS_BASE_URL:https://devsms.uz/api}
app.devsms.token=${DEVSMS_TOKEN:}
app.devsms.from=${DEVSMS_FROM:4546}
app.devsms.callback-url=${DEVSMS_CALLBACK_URL:}
app.devsms.mock-when-empty=${DEVSMS_MOCK:false}
app.devsms.service-name=${DEVSMS_SERVICE_NAME:Qoldan Qolga}
app.devsms.otp-template-type=${DEVSMS_OTP_TEMPLATE_TYPE:4}
app.devsms.otp-ttl-seconds=300
app.devsms.resend-cooldown-seconds=60
app.devsms.max-attempts=5
app.devsms.max-sends-per-hour=5

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

# Курс USD→UZS (запасной, если CBU недоступен)
currency.usd-uzs-fallback=12800
currency.cbu-json-url=https://cbu.uz/ru/arkhiv-kursov-valyut/json/
