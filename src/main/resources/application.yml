# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# Промо-тарифы (переопределяет дефолты из PromoProperties)
promo:
  services:
    day1:
      code: day1
      name-ru: "1 день"
      name-uz: "1 kun"
      price: 10000
      duration: 1
      priority: 10
      boost-interval-hours: 0
      vip: true
      top: false
      highlight: false
      features-ru:
        - "Поднимем объявление"
        - "VIP-метка"
        - "Больше просмотров"
      features-uz:
        - "E'lonni ko'taramiz"
        - "VIP belgi"
        - "Ko'proq ko'rishlar"
      description-ru: "VIP + мгновенное поднятие"
      description-uz: "VIP + darhol ko'tarish"
    week7:
      code: week7
      name-ru: "7 дней"
      name-uz: "7 kun"
      price: 30000
      duration: 7
      priority: 20
      boost-interval-hours: 24
      vip: true
      top: false
      highlight: false
      features-ru:
        - "VIP"
        - "Ежедневное поднятие"
        - "Приоритет в списке"
      features-uz:
        - "VIP"
        - "Har kuni ko'tarish"
        - "Ro'yxatda ustuvorlik"
      description-ru: "VIP + ежедневное поднятие"
      description-uz: "VIP + har kuni ko'tarish"
    month30:
      code: month30
      name-ru: "30 дней"
      name-uz: "30 kun"
      price: 75000
      duration: 30
      priority: 30
      boost-interval-hours: 24
      vip: true
      top: true
      highlight: false
      features-ru:
        - "VIP"
        - "Ежедневное поднятие"
        - "TOP-размещение"
      features-uz:
        - "VIP"
        - "Har kuni ko'tarish"
        - "TOP joylashuv"
      description-ru: "VIP + ежедневное поднятие + TOP"
      description-uz: "VIP + har kuni ko'tarish + TOP"
    premium:
      code: premium
      name-ru: "Premium"
      name-uz: "Premium"
      price: 120000
      duration: 30
      priority: 40
      boost-interval-hours: 12
      vip: true
      top: true
      highlight: true
      features-ru:
        - "TOP-размещение"
        - "VIP-метка"
        - "Максимальный приоритет"
        - "Выделение объявления"
        - "Регулярное поднятие"
        - "Больше показов"
      features-uz:
        - "TOP joylashuv"
        - "VIP belgi"
        - "Maksimal ustuvorlik"
        - "E'lonni ajratib ko'rsatish"
        - "Muntazam ko'tarish"
        - "Ko'proq ko'rsatish"
      description-ru: "VIP + TOP + максимальный приоритет"
      description-uz: "VIP + TOP + maksimal ustuvorlik"

# Системный диалог для уведомлений (подтверждение «Магазин»)
app:
  system:
    user-id: "00000000-0000-0000-0000-000000000001"
    ad-id: "00000000-0000-0000-0000-000000000002"
  public-url: ${APP_PUBLIC_URL:http://localhost:3000}

payment:
  mock: ${PAYMENT_MOCK:true}
  payme:
    merchant-id: ${PAYME_MERCHANT_ID:}
    key: ${PAYME_KEY:}
    checkout-base-url: ${PAYME_CHECKOUT_URL:https://checkout.paycom.uz}
  click:
    merchant-id: ${CLICK_MERCHANT_ID:}
    service-id: ${CLICK_SERVICE_ID:}
    secret-key: ${CLICK_SECRET_KEY:}
    merchant-user-id: ${CLICK_MERCHANT_USER_ID:}
    checkout-base-url: ${CLICK_CHECKOUT_URL:https://my.click.uz/services/pay}
